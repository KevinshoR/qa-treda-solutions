name: QA Test Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: |
          npm ci
          npx playwright install chromium --with-deps

      # La capa UI requiere sesión persistida por hCaptcha; en CI se ejecuta la capa de API
      - name: Ejecutar suite de pruebas
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: npx playwright test --project=backend

      - name: Publicar reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 15
